name: producer-ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements-ci.txt
      - name: Reject mutable external Action refs
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '^[[:space:]]*uses:[[:space:]]*[^./][^@[:space:]]*@v[0-9]' .github/workflows; then
            echo 'mutable external Action ref detected' >&2
            exit 1
          fi
      - run: python -m pytest -q

  real-trivy-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Download and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz' | sha256sum -c -
          tar -xzf trivy.tar.gz
          test "$(sha256sum trivy | cut -d' ' -f1)" = 'd89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791'
          test "$(./trivy --version | sed -n 's/^Version: //p')" = '0.74.0'
      - name: Run real producer and consumer
        run: |
          python -m src.producer --trivy ./trivy --artifact artifacts/requirements.txt --out out
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git core
          git -C core checkout --detach 52c224b36a54e450dbe25ad56988f29e4795753e
          test "$(git -C core rev-parse HEAD)" = "52c224b36a54e450dbe25ad56988f29e4795753e"
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --dir core install --frozen-lockfile
          pnpm --dir core build
          set +e
          node core/dist/cli.js verify --receipt out/receipt.json --artifact artifacts/requirements.txt --evidence out/evidence.json --policy permissive --format json > gate.json
          code=$?
          set -e
          test "$code" = "0" -o "$code" = "1" -o "$code" = "2"
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('gate.json')); const r=JSON.parse(fs.readFileSync('out/receipt.json')); if(g.receiptVerdict!==r.verdict || (r.verdict==='findings' && g.decision!=='fail') || (r.verdict==='clean' && g.decision==='fail')) process.exit(1);"
          node -e "const fs=require('fs'),c=require('crypto'); const e=JSON.parse(fs.readFileSync('out/evidence.json')); const r=JSON.parse(fs.readFileSync('out/receipt.json')); if(e.artifact.ref!=='artifacts/requirements.txt' || e.scan_input.source_ref!=='artifacts/requirements.txt') process.exit(1); if(e.invocation.argv.at(-1)==='artifacts/requirements.txt' || !e.invocation.argv.at(-1).includes('mcp-evidence-snapshot-')) process.exit(1); if(r.scanned_artifact_digest!=='sha256:'+e.scan_input.sha256) process.exit(1); if(e.artifact.sha256!==e.scan_input.sha256 || e.artifact.size!==e.scan_input.size) process.exit(1); if(r.evidence_digest!=='sha256:'+c.createHash('sha256').update(fs.readFileSync('out/evidence.json')).digest('hex')) process.exit(1); if(r.scanner_version!=='0.74.0') process.exit(1);"
          node -e "const fs=require('fs'); const e=JSON.parse(fs.readFileSync('out/evidence.json')); const x=e.scanner_execution; if(x?.completeness_status!=='complete' || x.required_work_completed!==true || x.result_semantics_consistent!==true || x.invocation_started!==true || x.process_completed!==true || x.output_present!==true || x.output_parseable!==true) process.exit(1);"

  real-osv-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}

      - name: Download and verify pinned OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner' | sha256sum -c -
          chmod +x osv-scanner
          test "$(./osv-scanner --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)" = '2.5.1'

      - name: Run real OSV producer and current consumer
        id: osv_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-osv
          python -m src.osv_producer --osv ./osv-scanner --artifact artifacts/requirements.txt --out out-osv

          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git core-osv
          git -C core-osv checkout --detach 52c224b36a54e450dbe25ad56988f29e4795753e
          test "$(git -C core-osv rev-parse HEAD)" = "52c224b36a54e450dbe25ad56988f29e4795753e"
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --dir core-osv install --frozen-lockfile
          pnpm --dir core-osv build

          set +e
          node core-osv/dist/cli.js verify \
            --receipt out-osv/receipt.json \
            --artifact artifacts/requirements.txt \
            --evidence out-osv/evidence.json \
            --policy permissive \
            --format json > gate-osv.json
          gate_code=$?
          set -e
          test "$gate_code" = "0" -o "$gate_code" = "1"

          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const receipt = JSON.parse(fs.readFileSync('out-osv/receipt.json'));
          const evidence = JSON.parse(fs.readFileSync('out-osv/evidence.json'));
          const gate = JSON.parse(fs.readFileSync('gate-osv.json'));
          const artifact = fs.readFileSync('artifacts/requirements.txt');
          const evidenceBytes = fs.readFileSync('out-osv/evidence.json');
          const raw = fs.readFileSync('out-osv/osv.raw.json');
          const sha = b => crypto.createHash('sha256').update(b).digest('hex');

          if (receipt.scanner !== 'osv-scanner') process.exit(1);
          if (receipt.scanner_version !== '2.5.1') process.exit(1);
          if (!['clean', 'findings'].includes(receipt.verdict)) process.exit(1);
          if (receipt.scanned_artifact_digest !== 'sha256:' + evidence.scan_input.sha256) process.exit(1);
          if (evidence.artifact.sha256 !== evidence.scan_input.sha256 || evidence.artifact.size !== evidence.scan_input.size) process.exit(1);
          if (evidence.artifact.ref !== 'artifacts/requirements.txt' || evidence.scan_input.source_ref !== 'artifacts/requirements.txt') process.exit(1);
          if (evidence.invocation.argv.at(-1) === 'artifacts/requirements.txt' || !evidence.invocation.argv.at(-1).includes('mcp-evidence-snapshot-')) process.exit(1);
          if (receipt.evidence_digest !== 'sha256:' + sha(evidenceBytes)) process.exit(1);
          if (evidence.scanner?.binary_sha256 !== 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be') process.exit(1);
          if (![0, 1].includes(evidence.invocation?.exit_code)) process.exit(1);
          if (evidence.raw_report?.sha256 !== sha(raw)) process.exit(1);
          if (evidence.scanner_database?.source !== 'https://osv.dev') process.exit(1);
          if (evidence.scanner_database?.snapshot !== 'unavailable') process.exit(1);
          if (gate.receiptVerdict !== receipt.verdict) process.exit(1);
          if (receipt.verdict === 'findings' && gate.decision !== 'fail') process.exit(1);
          if (receipt.verdict === 'clean' && !['pass', 'warn'].includes(gate.decision)) process.exit(1);
          const execution = evidence.scanner_execution;
          if (execution?.completeness_status !== 'complete' || execution.required_work_completed !== true || execution.result_semantics_consistent !== true || execution.invocation_started !== true || execution.process_completed !== true || execution.output_present !== true || execution.output_parseable !== true) process.exit(1);
          NODE

      - name: Upload OSV runtime evidence
        if: steps.osv_runtime.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-runtime-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            out-osv/
            gate-osv.json

      - name: Enforce OSV runtime result
        if: steps.osv_runtime.outcome != 'skipped'
        env:
          OSV_RUNTIME_OUTCOME: ${{ steps.osv_runtime.outcome }}
        run: test "$OSV_RUNTIME_OUTCOME" = success

  verify-producer:
    name: verify-producer
    if: always()
    needs:
      - deterministic-harness
      - real-trivy-consumer
      - real-osv-consumer
    runs-on: ubuntu-latest
    steps:
      - name: Require every Producer CI child to pass
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic-harness.result }}
          TRIVY_RESULT: ${{ needs.real-trivy-consumer.result }}
          OSV_RESULT: ${{ needs.real-osv-consumer.result }}
        run: |
          set -euo pipefail
          test "$DETERMINISTIC_RESULT" = success
          test "$TRIVY_RESULT" = success
          test "$OSV_RESULT" = success
